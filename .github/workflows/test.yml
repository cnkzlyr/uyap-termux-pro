name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: shellcheck
        run: shellcheck -S warning $(git ls-files '*.sh') bilesenler/uyap
      - name: Python birim testleri
        run: python3 -m unittest discover -s testler -v
      - name: E-imza koprusu (sahte CCID okuyucu + T=1 kart)
        run: python3 -I bilesenler/eimza/selftest.py
      - name: Java bilesenleri + birim testleri + eimza-agent.jar
        run: bash testler/java_testleri.sh
      - name: Muhur dogrulayici (muhursuz kopya 2 donmeli)
        run: |
          set +e; python3 tools/dogrula.py . --sessiz; rc=$?; set -e
          test "$rc" = 2
